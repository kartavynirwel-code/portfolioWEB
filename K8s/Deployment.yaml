apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: spring-app

  template:
    metadata:
      labels:
        app: spring-app

    spec:
      containers:
      - name: spring-app
        image: my-boot:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8080

        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-secret
              key: GITHUB_TOKEN
